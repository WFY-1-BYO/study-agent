plugins {
    id 'com.android.application'
}

android {
    namespace 'com.studyagent.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.studyagent.app'
        minSdk 23
        targetSdk 34
        // v2.1.0：P0–P4 重构修复（持久化 / 弹层 / 双端 / AI Key / 基线 / 导出 / 向导）
        versionCode 4
        versionName '2.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
