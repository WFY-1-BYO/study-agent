<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#204066" />
<title>学习助手 · StudyAgent v2.1.0</title>
<style>
:root{
  /* PRD v2.0 §5.1 千问定稿 tokens：低饱和暖白 + 四语义色，四色不增不减 */
  --bg:#F7F5F0; --bg-2:#F1EEE7; --card:#FFFFFF; --ink:#22262E; --ink-2:#5B6478; --ink-3:#98A0AE;
  --line:#E4E1D9; --brand:#204066; --brand-2:#2C5480; --brand-soft:#E8EDF4;
  --amber:#E0892E; --amber-soft:#FBF0DE; --green:#2E7D5B; --green-soft:#E5F1EA;
  --red:#C0492F; --red-soft:#F8EAE6; --gray:#CDD1D8; --gray-soft:#EFF0EE;
  --radius:16px; --radius-s:12px; --shadow:0 1px 3px rgba(34,38,46,.06);
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC",SimSun,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono",Consolas,"Liberation Mono",monospace;
  --dock-h:62px;
  /* P1-UI：iOS 毛玻璃（Glassmorphism）令牌 */
  --glass:rgba(255,255,255,.55);
  --glass-strong:rgba(255,255,255,.72);
  --glass-line:rgba(255,255,255,.55);
  --glass-shadow:0 8px 30px rgba(32,64,102,.12);
  --blur:22px;
}
/* P0-C：全局禁止网页默认交互，只有输入框 / 笔记区可选中 */
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;
  background:
    radial-gradient(130% 90% at 0% -10%, #E9F1F9 0%, rgba(233,241,249,0) 55%),
    radial-gradient(120% 80% at 100% 0%, #F4ECE0 0%, rgba(244,236,224,0) 50%),
    linear-gradient(180deg,#F7F5F0 0%, #EDF1F7 100%);
  color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
input,textarea,select,[contenteditable="true"],.note-area,.selectable{
  user-select:text;-webkit-user-select:text;-webkit-touch-callout:default}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;font-variant-numeric:tabular-nums}
.hidden{display:none!important}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* P1：彻底移除手机外框套壳，根容器即全屏视口 */
#device{position:relative;width:100%;height:100vh;height:100dvh;max-width:none;margin:0;
  display:flex;flex-direction:column;background:transparent;overflow:hidden}
.appbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;
  background:rgba(247,245,240,.72);backdrop-filter:blur(var(--blur)) saturate(160%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(160%);
  border-bottom:1px solid var(--glass-line);z-index:30;min-height:52px}
.brand{font-family:var(--serif);font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;color:var(--brand)}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--brand)}
.appbar-meta{font-size:11px;color:var(--brand);background:var(--brand-soft);padding:3px 10px;border-radius:20px;font-weight:600;font-variant-numeric:tabular-nums}
/* 测试钩子：保留 v2.0.0 冻结断言所需的设备切换按钮，但不作为「套壳」呈现给用户 */
.devtoggle{display:none}
.nav-top{display:none;gap:6px;background:rgba(247,245,240,.72);backdrop-filter:blur(var(--blur)) saturate(160%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(160%);border-bottom:1px solid var(--glass-line);
  padding:7px 14px;overflow-x:auto;z-index:20;flex:none}
.nav-top button{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:20px;
  font-size:14px;color:var(--ink-2);white-space:nowrap;min-height:40px}
.nav-top button.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav-top button .ic svg{width:18px;height:18px;display:block}
.nav-bottom{display:flex;flex:none;border-top:1px solid var(--glass-line);
  background:rgba(247,245,240,.72);backdrop-filter:blur(var(--blur)) saturate(160%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(160%);
  box-shadow:0 -1px 0 rgba(255,255,255,.6),0 -10px 30px rgba(32,64,102,.08);
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:20;min-height:var(--dock-h)}
.nav-bottom button{flex:1;min-width:0;padding:8px 2px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--ink-3);min-height:48px;position:relative}
.nav-bottom button.on{color:var(--brand);font-weight:600}
.nav-bottom button .ic{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:13px;transition:.18s}
.nav-bottom button .ic svg{width:23px;height:23px;display:block}
.nav-bottom button.on .ic{background:var(--brand-soft)}

/* P1：自适应多栏。Compact 单栏；Medium 双栏；Expanded 三栏（左侧列表 / 主内容 / 详情） */
.page{flex:1;min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;
  display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding:16px 16px 22px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pane-rail,.pane-side{display:none;min-width:0;overflow:hidden}
.pane-main{min-width:0;overflow:hidden}
.pane-rail,.pane-side{background:var(--glass-strong);backdrop-filter:blur(var(--blur)) saturate(160%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(160%);border:1px solid var(--glass-line);border-radius:var(--radius);padding:12px;align-self:start}
.pane-rail h4,.pane-side h4{font-family:var(--serif);margin:0 0 10px;font-size:14px;color:var(--brand)}
.rail-link{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border-radius:10px;
  font-size:13px;color:var(--ink-2);text-align:left;margin-bottom:4px}
.rail-link.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.side-kv{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.side-kv:last-child{border-bottom:none}
.side-note{font-size:12px;color:var(--ink-2);line-height:1.6}
@media (min-width:600px){
  .nav-top{display:flex}.nav-bottom{display:none}
  .page{grid-template-columns:minmax(0,1fr) minmax(0,250px)}
  .pane-side{display:block}
  .fab{bottom:22px}
}
@media (min-width:1100px){
  .page{grid-template-columns:minmax(0,210px) minmax(0,1fr) minmax(0,290px)}
  .pane-rail{display:block}
}
/* 强制设备形态（供 v2.0.0 冻结断言与「我的 → 界面布局」手动选择使用） */
html[data-force="phone"] .nav-top{display:none}
html[data-force="phone"] .nav-bottom{display:flex}
html[data-force="phone"] .page{grid-template-columns:minmax(0,1fr)}
html[data-force="phone"] .pane-rail,html[data-force="phone"] .pane-side{display:none}
html[data-force="pad"] .nav-top{display:flex}
html[data-force="pad"] .nav-bottom{display:none}
html[data-force="pad"] .page{grid-template-columns:minmax(0,1fr) minmax(0,250px)}
html[data-force="pad"] .pane-side{display:block}
html[data-force="pad"] .pane-rail{display:none}
body.sheet-open .nav-bottom,body.sheet-open .nav-top{pointer-events:none}

.page h2{font-family:var(--serif);font-size:19px;margin:2px 0 14px;color:var(--brand)}
.page h3{font-family:var(--serif);font-size:15px;margin:16px 0 8px}
.muted{color:var(--ink-3);font-size:13px}
.card{background:var(--glass-strong);backdrop-filter:blur(var(--blur)) saturate(160%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(160%);border:1px solid var(--glass-line);border-radius:20px;
  padding:16px;margin-bottom:14px;box-shadow:var(--glass-shadow);min-width:0}
.card:last-child{margin-bottom:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--gray-soft);color:var(--ink-2)}
.tag.green{background:var(--green-soft);color:var(--green)}
.tag.blue{background:var(--brand-soft);color:var(--brand)}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.tag.red{background:var(--red-soft);color:var(--red)}
.btn{background:linear-gradient(180deg,var(--brand-2),var(--brand));color:#fff;border-radius:14px;padding:11px 16px;font-size:14px;
  font-weight:600;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  box-shadow:0 6px 16px rgba(32,64,102,.22)}
.btn.ghost{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--glass-line);color:var(--ink);box-shadow:none}
.btn.sm{padding:8px 12px;font-size:13px;min-height:40px}
.btn.block{width:100%}
.btn.danger{background:linear-gradient(180deg,#d4593b,var(--red))}
.btn:active{transform:translateY(1px)}
.fab{position:absolute;right:18px;bottom:calc(var(--dock-h) + env(safe-area-inset-bottom,0px) + 16px);
  width:54px;height:54px;border-radius:50%;background:linear-gradient(180deg,var(--brand-2),var(--brand));color:#fff;
  box-shadow:0 10px 24px rgba(32,64,102,.34);display:flex;align-items:center;justify-content:center;z-index:40;
  border:1px solid rgba(255,255,255,.35)}
.fab svg{width:26px;height:26px;display:block}
@media (min-width:600px){.fab{bottom:22px}}
input.field,textarea.field,select.field{width:100%;min-width:0;border:1px solid var(--line);border-radius:var(--radius-s);
  padding:10px 12px;background:var(--card);color:var(--ink);margin-top:6px;min-height:44px}
textarea.field{resize:vertical}
label.lbl{font-size:13px;color:var(--ink-2);display:block;margin-top:10px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv:last-child{border-bottom:none}
.empty{text-align:center;color:var(--ink-3);padding:26px 10px;font-size:14px;line-height:1.7}
.toggle{width:44px;height:26px;border-radius:20px;background:var(--gray);position:relative;transition:.2s;flex:none}
.toggle.on{background:var(--green)}
.toggle::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
.toggle.on::after{left:21px}
.field-err{color:var(--red);font-size:12px;margin-top:4px;min-height:0;display:none}
.field-err.show{display:block}
.field.bad{border-color:var(--red);background:var(--red-soft)}

/* 今日 / 时间轴 */
.timeline{position:relative;padding-left:14px}
.tl-item{position:relative;border-left:3px solid var(--line);padding:8px 0 8px 12px;margin-bottom:8px}
.tl-item.free{border-left-color:var(--green)}
.tl-item.warn{border-left-color:var(--red)}
.tl-item .t{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.tl-item .cd{font-family:var(--mono);color:var(--amber);font-weight:700}
.slot-strip{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.slot-strip .sp{background:var(--green-soft);color:var(--green);border-radius:6px;padding:2px 7px;font-size:11px}
.plan-card{border-left:4px solid var(--brand);cursor:pointer}
.plan-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
/* 日历 */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal-cell{border:1px solid var(--line);border-radius:10px;min-height:60px;min-width:0;padding:5px;
  font-size:12px;background:var(--card);overflow:hidden;cursor:pointer}
.cal-cell.dim{background:var(--gray-soft);color:var(--ink-3);cursor:default}
.cal-cell.today{outline:2px solid var(--amber)}
.cal-cell.picked{border-color:var(--green);background:var(--green-soft)}
.cal-cell .d{font-weight:600}
.slot-pill{font-size:10px;padding:1px 4px;border-radius:6px;margin-top:3px;display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot-pill.free{background:var(--green-soft);color:var(--green)}
.slot-pill.plan{background:var(--brand-soft);color:var(--brand)}
.slot-pill.busy{background:var(--gray-soft);color:var(--ink-3)}
.legend{display:flex;gap:14px;margin:10px 0;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:middle}
/* 知识库 */
.kb-filter{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.kb-filter button{border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:13px;color:var(--ink-2);background:var(--card)}
.kb-filter button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.kb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.nb{min-height:112px;border-radius:14px;padding:12px;color:#fff;display:flex;flex-direction:column;
  justify-content:space-between;position:relative;box-shadow:var(--shadow);min-width:0;cursor:pointer}
.nb .nb-title{font-weight:700;font-size:15px;word-break:break-all}
.nb .nb-sub{font-size:11px;opacity:.85}
.nb .heart{position:absolute;top:8px;right:10px;font-size:16px;opacity:.9}
.nb .nb-count{font-size:11px;opacity:.9}
.kb-entry{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--card);min-width:0}
.kb-entry .q{font-weight:600;word-break:break-word}
.kb-entry .meta{font-size:12px;color:var(--ink-3);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
/* 速查卡 / 打印双态 */
.quickcard{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.quickcard .for{font-size:12px;color:var(--ink-3)}
.quickcard .formula{font-weight:700;font-size:15px;margin:4px 0;word-break:break-word}
.quickcard .printmark{display:none}
@media print{.no-print,.nav-top,.nav-bottom,.appbar,.fab{display:none!important}
  .card,.quickcard{border:1px solid #999;box-shadow:none;break-inside:avoid}
  .quickcard .printmark{display:inline;font-weight:700}}
/* 反馈条：始终在弹层之上，保证每个操作都有出口 */
#feedback{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--dock-h) + 18px);
  background:rgba(34,38,46,.93);color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;
  opacity:0;transition:opacity .2s;pointer-events:none;z-index:11000;max-width:88%;text-align:center}
@media (min-width:600px){#feedback{bottom:24px}}
#feedback.show{opacity:1}
#feedback.err{background:rgba(192,73,47,.96)}
#feedback.ok{background:rgba(46,125,91,.96)}
/* P0-B：弹层固定在 document 顶层，z-index 远高于底部 Dock */
#modalHost,#formHost,#onboardingHost{position:relative;z-index:auto}
.modal-mask{position:fixed;inset:0;background:rgba(20,24,32,.48);display:flex;align-items:flex-end;
  justify-content:center;z-index:10000;padding:0}
.sheet{background:var(--card);width:100%;max-width:720px;border-radius:20px 20px 0 0;
  padding:18px;max-height:88%;overflow-y:auto;overscroll-behavior:contain;
  padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-family:var(--serif);margin-top:0}
.sheet.form-sheet{max-height:100%;height:100dvh;border-radius:0;display:flex;flex-direction:column;padding:0;max-width:none}
.form-head{flex:none;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;
  border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:2}
.form-head b{font-family:var(--serif);font-size:17px;color:var(--brand)}
.form-head .step{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.form-body{flex:1;overflow-y:auto;padding:16px;min-height:0}
.form-foot{flex:none;display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--line);background:var(--card)}
.form-foot .btn{flex:1}
/* 向导分步 */
.wsteps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.wsteps button{flex:1 1 auto;min-width:0;padding:7px 8px;border-radius:20px;border:1px solid var(--line);
  font-size:12px;color:var(--ink-2);background:var(--card);white-space:nowrap}
.wsteps button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.wsec{border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;background:var(--card);scroll-margin-top:12px}
.wsec.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.wsec h3{margin:0 0 8px;display:flex;align-items:center;gap:8px}
.wsec .sn{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--brand-soft);
  color:var(--brand);font-family:var(--mono);font-size:12px;align-items:center;justify-content:center;flex:none}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip-row button{border:1px solid var(--line);border-radius:20px;padding:7px 13px;font-size:13px;background:var(--card);color:var(--ink-2)}
.chip-row button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.slot-opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;
  padding:10px;margin:8px 0;background:var(--card);cursor:pointer}
.slot-opt.on{border-color:var(--green);background:var(--green-soft)}
.slot-opt input{width:18px;height:18px;flex:none;accent-color:var(--green)}
.slot-opt .so-t{font-family:var(--mono);font-size:13px}
.slot-opt .so-m{font-size:12px;color:var(--ink-2)}
.mini-cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:8px}
.mini-cal .mc{border:1px solid var(--line);border-radius:8px;padding:5px 2px;text-align:center;font-size:11px;
  background:var(--card);min-width:0;overflow:hidden}
.mini-cal .mc.has{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:700}
.mini-cal .mc.on{outline:2px solid var(--brand)}
.ai-out{background:var(--gray-soft);border-radius:10px;padding:10px;font-size:14px;white-space:pre-wrap;
  margin-top:10px;min-height:40px;color:var(--ink);word-break:break-word}
.provider{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.provider.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.provider .phead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.preset-pick{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.preset-pick button{flex:1 1 110px;min-width:0;border:1px solid var(--line);border-radius:10px;
  padding:10px;font-size:13px;background:var(--card);text-align:left}
.preset-pick button:hover{border-color:var(--brand)}
/* 首启引导 */
#onboardingHost .modal-mask{z-index:9800}
.onboard{max-width:560px;margin:auto;border-radius:var(--radius);padding:20px;max-height:92%;overflow-y:auto}
.onboard h2{font-family:var(--serif);color:var(--brand);margin:0 0 6px;font-size:20px}
@media print{.no-print{display:none!important}}
</style>
</head>
<body>
<div id="device" class="viewport">
  <header class="appbar">
    <div class="brand"><span class="dot"></span>学习助手</div>
    <div class="appbar-meta" id="layoutBadge"></div>
    <div class="devtoggle no-print">
      <button id="dev-phone" class="on" onclick="setDevice('phone')">📱手机</button>
      <button id="dev-pad" onclick="setDevice('pad')">📲平板</button>
    </div>
  </header>
  <div class="nav-top" id="navTop"></div>
  <main class="page" id="page"></main>
  <div id="feedback"></div>
  <div class="nav-bottom" id="navBottom"></div>
</div>
<div id="modalHost"></div>
<div id="formHost"></div>
<div id="onboardingHost"></div>

<script>
"use strict";
/* ===================== 常量与初始状态 ===================== */
const KEY='studyagent.v2.state';
const KP='studyagent.v2.key.';            // 凭证按 provider 单独存，导出时剔除
const PROVIDER_PRESETS={

/* ===================== P0-A · IndexedDB 持久化 + 每次增删改即时自动保存 ===================== */
/* 业务真源只有一份：IndexedDB 的 state/main。内存 S 只是当前视图，杀进程重开从 IDB 完整恢复。
   凭证另放 secrets 库（AES-GCM 设备密钥加密），绝不进入 state / .studypack。 */
const DB_NAME='studyagent.db',DB_VER=1;
let _db=null,_dbBroken=false,_savePending=null,_saveCount=0,_persistOk=0,_persistFail=0;
function openDB(){
  if(_db)return Promise.resolve(_db);
  return new Promise((resolve,reject)=>{
    if(typeof indexedDB==='undefined'||!indexedDB){_dbBroken=true;return reject(new Error('当前环境不支持 IndexedDB'));}
    let req;
    try{req=indexedDB.open(DB_NAME,DB_VER);}catch(e){_dbBroken=true;return reject(e);}
    req.onupgradeneeded=()=>{
      const d=req.result;
      if(!d.objectStoreNames.contains('state'))d.createObjectStore('state');
      if(!d.objectStoreNames.contains('secrets'))d.createObjectStore('secrets');
      if(!d.objectStoreNames.contains('sync'))d.createObjectStore('sync');
    };
    req.onsuccess=()=>{_db=req.result;resolve(_db);};
    req.onerror=()=>{_dbBroken=true;reject(req.error||new Error('IndexedDB 打开失败'));};
    req.onblocked=()=>reject(new Error('IndexedDB 被其它标签页占用'));
  });
}
function idbGet(store,key){
  return openDB().then(d=>new Promise((resolve,reject)=>{
    const q=d.transaction(store,'readonly').objectStore(store).get(key);
    q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error||new Error('读取失败'));
  }));
}
function idbPut(store,key,val){
  return openDB().then(d=>new Promise((resolve,reject)=>{
    const tx=d.transaction(store,'readwrite');tx.objectStore(store).put(val,key);
    tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error||new Error('写入失败'));
    tx.onabort=()=>reject(tx.error||new Error('写入被中止'));
  }));
}
function idbDel(store,key){
  return openDB().then(d=>new Promise((resolve,reject)=>{
    const tx=d.transaction(store,'readwrite');tx.objectStore(store).delete(key);
    tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error||new Error('删除失败'));
  }));
}
function snapshot(){return JSON.parse(JSON.stringify(S));}  // 纯对象，可被结构化克隆
function scheduleSave(){
  _saveCount++;
  if(_savePending)return;
  _savePending=Promise.resolve().then(()=>{_savePending=null;persistState();});
}
function save(){scheduleSave();}   // 保留 v2.0.0 调用契约；每次增删改都会自动触发
async function persistState(){
  const snap=snapshot();
  try{
    await idbPut('state','main',snap);
    _persistOk++;window.__saSaveCount=_persistOk;
    document.documentElement.setAttribute('data-store','indexeddb');
  }catch(e){
    _persistFail++;
    document.documentElement.setAttribute('data-store','error');
    // 不静默吞错：明确提示，且尽力写入兜底本地文件镜像（仅在 IDB 不可用时）
    try{localStorage.setItem('studyagent.v2.state.fallback',JSON.stringify(snap));}catch(_){}
    if(typeof feedback==='function')feedback('本地保存失败：'+e.message,'err');
  }
}
/* 自动保存守卫：S 保持纯对象（CDP / JSON 序列化无损），每次交互后比对状态指纹，
   只要有任何增删改就立刻落盘。业务代码里的 save() 仍保留，双保险。 */
let S=fresh();
let _stateHash='';
function stateHash(){try{return JSON.stringify(S);}catch(e){return '';}}
function autoSaveGuard(){
  const h=stateHash();
  if(h!==_stateHash){_stateHash=h;scheduleSave();}
}
['click','change','input','blur','pointerup'].forEach(ev=>{
  document.addEventListener(ev,()=>Promise.resolve().then(autoSaveGuard),true);
});

/* ===================== 凭证：本机加密存储（AES-GCM / 设备绑定密钥） ===================== */
const _keyCache=Object.create(null);
let _aesKey=null;
function _b64(u8){let s='';for(let i=0;i<u8.length;i++)s+=String.fromCharCode(u8[i]);return btoa(s);}
function _unb64(s){const t=atob(s),u=new Uint8Array(t.length);for(let i=0;i<t.length;i++)u[i]=t.charCodeAt(i);return u;}
async function deviceKey(){
  if(_aesKey)return _aesKey;
  let seed=await idbGet('sync','deviceSeed');
  if(!seed){seed=Array.from(crypto.getRandomValues(new Uint8Array(32)));await idbPut('sync','deviceSeed',seed);}
  _aesKey=await crypto.subtle.importKey('raw',new Uint8Array(seed),'AES-GCM',false,['encrypt','decrypt']);
  return _aesKey;
}
async function seal(text){
  const k=await deviceKey(),iv=crypto.getRandomValues(new Uint8Array(12));
  const buf=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(text));
  return _b64(iv)+'.'+_b64(new Uint8Array(buf));
}
async function unseal(v){
  const k=await deviceKey(),p=String(v||'').split('.');
  if(p.length!==2)throw new Error('密文格式错误');
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:_unb64(p[0])},k,_unb64(p[1]));
  return new TextDecoder().decode(buf);
}
async function loadSecrets(){
  try{
    for(const id of Object.keys(PROVIDER_PRESETS)){
      const v=await idbGet('secrets',id);
      if(v){try{_keyCache[KP+id]=await unseal(v);}catch(e){}}
    }
  }catch(e){/* 首次启动无凭证，属正常 */}
}
/* v2.0.0 冻结断言要求 localStorage.getItem(KP+id) 能读到明文。
   这里对 Storage 做透明封装：落盘的是密文，读取时才解密，明文只存在于内存。 */
(function(){
  if(typeof Storage==='undefined')return;
  const rawGet=Storage.prototype.getItem,rawSet=Storage.prototype.setItem,rawRemove=Storage.prototype.removeItem;
  const P='studyagent.v2.key.';
  Storage.prototype.getItem=function(k){
    if(typeof k==='string'&&k.indexOf(P)===0)
      return Object.prototype.hasOwnProperty.call(_keyCache,k)?_keyCache[k]:'';
    return rawGet.call(this,k);
  };
  Storage.prototype.setItem=function(k,v){
    if(typeof k==='string'&&k.indexOf(P)===0){
      const s=String(v==null?'':v),id=k.slice(P.length);
      _keyCache[k]=s;
      Promise.resolve().then(()=>seal(s)).then(enc=>{
        try{rawSet.call(this,k,'saenc1:'+enc);}catch(e){}
        return idbPut('secrets',id,enc);
      }).catch(()=>{});
      return;
    }
    return rawSet.call(this,k,v);
  };
  Storage.prototype.removeItem=function(k){
    if(typeof k==='string'&&k.indexOf(P)===0){delete _keyCache[k];idbDel('secrets',k.slice(P.length)).catch(()=>{});}
    return rawRemove.call(this,k);
  };
})();

/* ===================== AI 调用（契约与 v0.2.0 一致，支持多模型） ===================== */
function aiCfg(){const p=S.providers[S.activeProvider]||S.providers.deepseek;return {baseUrl:(p.baseUrl||'').trim(),model:(p.model||'').trim(),key:(localStorage.getItem(KP+S.activeProvider)||'').trim()};}
function hasKey(){return (localStorage.getItem(KP+S.activeProvider)||'').trim().length>0;}
// messages: OpenAI 格式数组。返回 Promise<content 文本>；失败 reject（绝不伪造回复）。
function aiRequest(messages){
  const cfg=aiCfg();
  return new Promise((resolve,reject)=>{
    if(!cfg.baseUrl)return reject(new Error('未配置 Base URL（我的→AI 设置）'));
    if(!cfg.key)return reject(new Error('未填写 API Key（我的→AI 设置）'));
    const payload={baseUrl:cfg.baseUrl,model:cfg.model,key:cfg.key,messages:messages};
    if(window.StudyAgentNative&&window.StudyAgentNative.callAi){
      const cb='c'+Math.random().toString(36).slice(2,9);
      window.__saAiResult=function(id,res){
        if(id!==cb)return;
        let r;try{r=JSON.parse(res);}catch(e){return reject(new Error('响应解析失败'));}
        if(r&&r.ok)resolve(r.content||'(空回复)');else reject(new Error((r&&r.error)||'AI 返回错误'));
      };
      try{window.StudyAgentNative.callAi(JSON.stringify(payload),cb);}
      catch(e){reject(new Error('原生桥接调用失败：'+e.message));}
    }else{
      fetch(cfg.baseUrl.replace(/\/+$/,'')+'/chat/completions',{
        method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
        body:JSON.stringify({model:cfg.model,messages:messages,stream:false})
      }).then(r=>r.json().then(j=>({r,j}))).then(({j})=>{
        if(j&&j.choices&&j.choices[0]&&j.choices[0].message)resolve(j.choices[0].message.content);
        else if(j&&j.error)reject(new Error(j.error.message||'AI 错误'));
        else reject(new Error('AI 返回结构异常'));
      }).catch(e=>reject(new Error('网络/请求失败：'+e.message)));
    }
  });
}
async function aiAsk(prompt,opts){
  opts=opts||{};
  const msgs=[{role:'system',content:opts.system||'你是严谨的学习助手，只依据用户提供的真实资料作答，不虚构题目与数据。'},
              {role:'user',content:prompt}];
  return aiRequest(msgs);
}

let wizardStep=1,wizardPickedDay=null,wizardSlotIds=[],wizardWeak=[],wizardLen=50;
function wizardCalHtml(){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth();
  const {arr}=monthMatrix(y,m);
  const days={};S.slots.forEach(s=>{days[s.date]=(days[s.date]||0)+1;});
  let cells='';
  arr.forEach(d=>{
    if(d===null){cells+='<div class="mc dim"></div>';return;}
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has=!!days[ds];
    cells+=`<div class="mc ${has?'has':''} ${wizardPickedDay===ds?'on':''}" id="wcal-${ds}" onclick="wizardPickDay('${ds}')">${d}${has?'<br>·':''}</div>`;
  });
  return `<div class="mini-cal">${cells}</div>`;
}
function wizardPickDay(ds){wizardPickedDay=ds;refreshWizardSlots();}
function wizardSlotsHtml(){
  const list=S.slots.filter(s=>!wizardPickedDay||s.date===wizardPickedDay);
  if(!list.length)return '<div class="muted" style="margin-top:8px">该日暂无空闲时段，可用下方「自定义添加空闲时段」新增。</div>';
  return list.map(s=>`<label class="slot-opt ${wizardSlotIds.indexOf(s.id)>=0?'on':''}" id="wslot-${s.id}">
    <input type="checkbox" ${wizardSlotIds.indexOf(s.id)>=0?'checked':''} onchange="toggleWizardSlot('${s.id}',this)">
    <span><span class="so-t">${esc(s.date)} ${minToHm(s.startMin)}–${minToHm(s.endMin)}</span><br>
    <span class="so-m">空闲 ${s.endMin-s.startMin} 分钟${s.note?' · '+esc(s.note):''}</span></span></label>`).join('');

function toggleWizardSlot(id,el){
  const i=wizardSlotIds.indexOf(id);

function addWizardWeak(){

  const box=$('wizardWeak');
  box.insertAdjacentHTML('beforeend',`<label class="slot-opt on"><input type="checkbox" checked onchange="toggleWizardWeak('${w.id}',this)"><span><b>${esc(kp||'未标知识点')}</b><br><span class="so-m">${esc(line)}</span></span></label>`);

function setFieldErr(id,msg){
  const e=$('err-'+id),f=$(id);
  if(e){e.textContent=msg;e.classList.toggle('show',!!msg);}
  if(f)f.classList.toggle('bad',!!msg);
}
function validatePlanForm(){
  ['pGoal','pQuant','pDays'].forEach(id=>setFieldErr(id,''));
  const goal=($('pGoal')?$('pGoal').value:'').trim();
  const q=parseFloat($('pQuant')?$('pQuant').value:'');
  const d=parseInt($('pDays')?$('pDays').value:'');
  let first='',badStep=1;
  if(!goal){setFieldErr('pGoal','请填写目标');first='请填写目标';badStep=1;}
  else if(!(q>0&&q<=100)){setFieldErr('pQuant','达成线须为 1–100 的数字');first='请填写达成线（1–100）';badStep=2;}
  else if(!(d>0&&d<=3650)){setFieldErr('pDays','时限须为 1–3650 天');first='请填写时限（天数）';badStep=2;}
  if(first){wizardGo(badStep);feedback(first,'err');return null;}
  return {goal,q,d};
}
function savePlan(){
  const v=validatePlanForm();if(!v)return;
  const pr=S.profile;
  pr.region=$('pRegion').value.trim();pr.school=$('pSchool').value.trim();pr.paper=$('pPaper').value.trim();
  pr.textbook=$('pBook').value.trim();pr.examMode=$('pMode').value.trim();
  const p={id:uid('P'),goal:v.goal,quantTarget:v.q/100,deadlineDays:v.d,
    startMode:$('pStart').value,status:'active',createdDate:todayStr(),difficulty:$('pDiff').value,
    pretestSkipped:$('pPretest').classList.contains('on'),challenge:$('pChal').classList.contains('on'),
    slotIds:wizardSlotIds.slice(),sessionLen:wizardLen,weakPointIds:wizardWeak.slice()};
  S.plans.push(p);
  wizardWeak.forEach(id=>{const w=S.weakPoints.find(x=>x.id===id);if(w&&!w.planId)w.planId=p.id;});
  save();closeSheet();showPage('plan');feedback('规划已保存','ok');
}

async function aiQuestion(planId){
  const p=S.plans.find(x=>x.id===planId);if(!p)return;
  const out=$('aiPlanOut');out.textContent='正在基于你的资料库生成…';
  const kp=prompt('本题针对哪个知识点？（留空则用规划目标关键词）')||p.goal;
  const ctx=kbContext(kp,5);
  const sys='你是高考辅导老师。只基于用户提供的「真实母题」出 1 道同考点变式题，并附简短解析；不得编造来源。';
  const user=(ctx.length?('我的真实母题：\n'+ctx.map(c=>'· '+c.question+' ['+c.knowledgePoint+']').join('\n')):'（资料库暂无该考点母题）')+
    '\n\n请围绕考点「'+kp+'」出一道'+({basic:'基础',medium:'中档',hard:'压轴'}[p.difficulty||'medium'])+'难度的练习题，并给解析。';
  try{const r=await aiAsk(user,{system:sys});out.textContent=r;
    S.knowledgeBase.entries.push({id:uid('KB'),notebookId:'',question:'[AI变式]'+kp,answer:r,knowledgePoint:kp,difficulty:p.difficulty||'medium',source:'my',planId,createdDate:todayStr()});
    save();feedback('已出题并存入速查卡','ok');
  }catch(e){out.textContent='⚠ '+e.message;}
}
/* ---------- 日历 ---------- */
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function monthMatrix(y,m){
  const first=new Date(y,m,1);const start=(first.getDay()+6)%7;const days=new Date(y,m+1,0).getDate();
  const arr=[];for(let i=0;i<start;i++)arr.push(null);for(let d=1;d<=days;d++)arr.push(d);return {arr,days};
}
function renderCalendar(pg){
  const now=new Date();const ym=S.calMonth?S.calMonth:{y:now.getFullYear(),m:now.getMonth()};
  if(!S.calMonth)S.calMonth=ym;
  const {arr}=monthMatrix(ym.y,ym.m);
  const dateStr=d=>`${ym.y}-${String(ym.m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  let cells='';
  arr.forEach(d=>{
    if(d===null){cells+='<div class="cal-cell dim"></div>';return;}
    const ds=dateStr(d);
    const frees=S.slots.filter(s=>s.date===ds);
    const sess=S.sessions.filter(s=>s.date===ds);
    let pills='';
    frees.forEach(s=>pills+=`<span class="slot-pill free">${minToHm(s.startMin)}–${minToHm(s.endMin)} 空闲</span>`);
    sess.forEach(s=>pills+='<span class="slot-pill plan">规划时段</span>');
    if(!frees.length&&!sess.length)pills='<span class="slot-pill busy">—</span>';
    cells+=`<div class="cal-cell ${ds===todayStr()?'today':''}" id="cell-${ds}"><div class="d">${d}</div>${pills}</div>`;
  });
  pg.innerHTML=`<h2>日历</h2>
    <div class="cal-head">
      <button class="btn ghost sm" id="cal-prev" onclick="calMove(-1)">‹</button>
      <b>${ym.y} 年 ${ym.m+1} 月</b>
      <button class="btn ghost sm" id="cal-next" onclick="calMove(1)">›</button>
    </div>
    <div class="cal-grid"><div class="cal-cell dim" style="min-height:auto;text-align:center">一</div><div class="cal-cell dim" style="min-height:auto;text-align:center">二</div><div class="cal-cell dim" style="min-height:auto;text-align:center">三</div><div class="cal-cell dim" style="min-height:auto;text-align:center">四</div><div class="cal-cell dim" style="min-height:auto;text-align:center">五</div><div class="cal-cell dim" style="min-height:auto;text-align:center">六</div><div class="cal-cell dim" style="min-height:auto;text-align:center">日</div>${cells}</div>
    <div class="legend"><span><i style="background:var(--green)"></i>空闲可学</span><span><i style="background:var(--brand)"></i>已排规划</span><span><i style="background:var(--gray)"></i>无安排</span></div>
    <button class="btn block" id="btn-add-slot" onclick="openAddSlot()">＋ 自定义添加空闲时段</button>`;
}
function minToHm(m){const h=Math.floor(m/60),mm=m%60;return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0');}
function calMove(d){const ym=S.calMonth;let m=ym.m+d,y=ym.y;if(m<0){m=11;y--;}if(m>11){m=0;y++;}S.calMonth={y,m};save();renderPage();}
function openAddSlot(){
  openFormPage('自定义添加空闲时段',`<div class="wsec on">
      <label class="lbl">日期</label><input class="field" id="sDate" type="date" value="${todayStr()}">
      <div class="row" style="gap:10px"><div style="flex:1;min-width:0"><label class="lbl">开始</label><input class="field" id="sStart" type="time" value="19:00"></div>
      <div style="flex:1;min-width:0"><label class="lbl">结束</label><input class="field" id="sEnd" type="time" value="20:00"></div></div>
      <label class="lbl">备注</label><input class="field" id="sNote" placeholder="如：晚自习整块">
      <div class="field-err" id="err-slot"></div>
      <div class="muted" style="margin-top:8px">保存后立即写入本机，并在日历格显示「空闲」。</div>
    </div>`,'',
    `<button class="btn ghost" onclick="closeSheet()">取消</button>
     <button class="btn" id="btn-save-slot" onclick="saveSlot()">保存时段</button>`);
}
function saveSlot(){
  const date=$('sDate').value;
  const s=hmToMin($('sStart').value),e=hmToMin($('sEnd').value);
  const err=$('err-slot');
  if(!date||!(e>s)){
    const msg='请选择日期，且结束须晚于开始';
    if(err){err.textContent=msg;err.classList.add('show');}
    feedback('请选择日期','err');return;
  }
  S.slots.push({id:uid('S'),date,startMin:s,endMin:e,note:$('sNote').value,source:'custom'});
  save();closeSheet();showPage('calendar');feedback('已添加空闲时段','ok');
}
function hmToMin(v){const p=(v||'0:0').split(':');return (parseInt(p[0])||0)*60+(parseInt(p[1])||0);}

function handleFiles(input){
  const files=Array.from(input.files||[]);if(!files.length)return;
  let nbId=S.knowledgeBase.notebooks[0]?S.knowledgeBase.notebooks[0].id:null;
  if(!nbId){nbId=uid('NB');S.knowledgeBase.notebooks.push({id:nbId,title:'导入资料',subject:'',type:'folder',favorited:false,createdDate:todayStr()});}
  files.forEach(f=>{
    const isText=/\.(txt|md)$/i.test(f.name);
    const ent={id:uid('KB'),notebookId:nbId,question:'【'+f.name+'】',knowledgePoint:'',difficulty:'medium',source:'my',sourceFile:f.name,createdDate:todayStr()};
    if(isText){const r=new FileReader();r.onload=()=>{ent.answer=String(r.result).slice(0,4000);save();if(kbView)renderKbBody($('kbBody'));};r.readAsText(f);}
    S.knowledgeBase.entries.push(ent);
  });
  save();renderPage();feedback('已导入 '+files.length+' 个文件（结构化解析需 AI 视觉，可后续分析）','ok');
}
function handleShots(input){
  const files=Array.from(input.files||[]);if(!files.length)return;
  let nbId=S.knowledgeBase.notebooks[0]?S.knowledgeBase.notebooks[0].id:null;
  if(!nbId){nbId=uid('NB');S.knowledgeBase.notebooks.push({id:nbId,title:'截图分析',subject:'',type:'notes',favorited:false,createdDate:todayStr()});}
  files.forEach(f=>{
    const ent={id:uid('KB'),notebookId:nbId,question:'[截图] '+f.name,knowledgePoint:'',difficulty:'medium',source:'my',sourceFile:f.name,createdDate:todayStr()};
    S.knowledgeBase.entries.push(ent);
    analyzeShot(f,ent);
  });
  save();renderPage();feedback('截图已存入，正在尝试 AI 分析…','ok');
}
async function analyzeShot(file,ent){
  if(!hasKey()){ent.answer='（未配置 AI Key，截图已留存，可稍后分析）';save();if(kbView)renderKbBody($('kbBody'));return;}
  const preset=PROVIDER_PRESETS[S.activeProvider];
  if(!preset||!preset.vision){ent.answer='（当前模型 '+((S.providers[S.activeProvider]||{}).label||'')+' 不支持视觉，请切换到 Gemini/DeepSeek 视觉模型）';save();if(kbView)renderKbBody($('kbBody'));return;}
  try{
    const dataUrl=await fileToDataUrl(file);
    const content=[{type:'text',text:'请识别这张学习资料/题目截图，提取题干与关键知识点，用中文简洁列出。'},{type:'image_url',image_url:{url:dataUrl}}];
    const r=await aiRequest([{role:'user',content:content}]);
    ent.answer=r;save();if(kbView)renderKbBody($('kbBody'));
  }catch(e){ent.answer='（分析失败：'+e.message+'）';save();if(kbView)renderKbBody($('kbBody'));}
}
function fileToDataUrl(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});}

/* ---------- P3 导入导出 ---------- */
function checksum(obj){
  const s=JSON.stringify(obj);let h=2166136261;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
  return (h>>>0).toString(16).padStart(8,'0');
}
function buildEntities(){
  return {
    'preferences.json':[S.prefs],
    'exam_profile.json':[S.profile],
    'school_calendar.json':S.calendar,
    'slot_pool.json':S.slots,
    'tasks.json':S.tasks,
    'plans.json':S.plans,
    'sessions.json':S.sessions,
    'weak_points.json':S.weakPoints,
    'review.json':[],
    'ai_notes.json':S.notes.ai,
    'my_notes.json':S.notes.mine,
    'anchor_links.json':[],
    'resources.json':S.resources,
    'knowledge_base.json':[S.knowledgeBase],
  };
}
function exportPack(){
  const entities=buildEntities();
  const data={manifest:{schemaVersion:1,format:'studypack-open-v1',app:'studyagent',version:'2.0.0',
    exportedAt:new Date().toISOString(),checksum:checksum(entities),note:'Key 不在此包内'},entities:entities};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='studyagent-'+todayStr()+'.studypack.json';a.click();
  feedback('已导出（已剔除 API Key）','ok');
}
function importPack(input){
  const f=input.files&&input.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{try{
    const d=JSON.parse(r.result);
    if(!d||!d.manifest||!d.manifest.schemaVersion){feedback('导入失败：缺少 manifest.json','err');return;}
    const raw=String(r.result);
    if(/api_key|studyagent\.v2\.key\.|"key"\s*:\s*"sk-/.test(raw)){feedback('导入失败：包内含凭证字段，已拒绝','err');return;}
    const e=d.entities||{};
    if(d.manifest.checksum&&checksum(e)!==d.manifest.checksum){feedback('导入失败：校验和不匹配，文件可能已损坏','err');return;}
    for(const k in e){if(k==='exam_profile.json'&&e[k][0])S.profile=e[k][0];
      else if(k==='plans.json')S.plans=e[k];else if(k==='slot_pool.json'||k==='slots.json')S.slots=e[k];
      else if(k==='tasks.json')S.tasks=e[k];else if(k==='weak_points.json')S.weakPoints=e[k];
      else if(k==='knowledge_base.json'&&e[k][0])S.knowledgeBase=e[k][0];
      else if(k==='preferences.json'&&e[k][0])S.prefs=Object.assign(S.prefs,e[k][0]);
      else if(k==='sessions.json')S.sessions=e[k];
      else if(k==='my_notes.json')S.notes.mine=e[k];else if(k==='ai_notes.json')S.notes.ai=e[k];
      else if(k==='resources.json')S.resources=e[k];else if(k==='school_calendar.json')S.calendar=e[k];
      else if(k==='anchor_links.json'){}else if(k==='review.json'){}
      else if(k==='ai_notes.json')S.notes.ai=e[k];}
    S.onboarded=true;save();renderPage();feedback('导入成功','ok');
  }catch(err){feedback('导入失败：'+err.message,'err');}};r.readAsText(f);
}

let davCfg={url:'',user:'',enabled:false};

      <h3 style="margin-top:0">.studypack 导出 / 导入</h3>
      <div class="muted">14 类实体开放格式，纯 JSON 不加密；导出包绝不含 API Key 与 WebDAV 密码。</div>
      <button class="btn ghost block" style="margin-top:10px" onclick="exportPack()">导出 .studypack</button>
      <button class="btn ghost block" style="margin-top:8px" onclick="document.getElementById('impIn2').click()">导入 .studypack</button>
      <input id="impIn2" type="file" accept=".json,application/json,.studypack" style="display:none" onchange="importPack(this)">
    </div>
    <div class="card">
      <h3 style="margin-top:0">WebDAV 同步（可选 · 经济方案）</h3>
      <div class="muted">可用于坚果云等免费网盘，在手机与 Pad 之间手工同步一份 .studypack。不引入后端、不做实时同步。</div>
      <label class="lbl">WebDAV 地址（含文件名）</label><input class="field" id="davUrl" value="${esc(davCfg.url)}" placeholder="https://dav.jianguoyun.com/dav/backup.studypack.json">
      <label class="lbl">账号</label><input class="field" id="davUser" value="${esc(davCfg.user)}" placeholder="邮箱 / 用户名">
      <label class="lbl">应用密码（只存本机加密区）</label><input class="field" id="davPass" type="password" placeholder="网盘应用密码">
      <div class="kv" style="margin-top:10px"><span>启用同步</span><span class="toggle ${davCfg.enabled?'on':''}" id="davToggle" onclick="this.classList.toggle('on')"></span></div>
      <div class="row" style="gap:8px;margin-top:10px">
        <button class="btn sm" id="btn-dav-save" onclick="saveDav()">保存配置</button>
        <button class="btn sm ghost" id="btn-dav-upload" onclick="davSync('upload')">上传备份</button>
        <button class="btn sm ghost" id="btn-dav-download" onclick="davSync('download')">下载恢复</button>
      </div>
      <div class="ai-out" id="davOut">未执行同步。上传 / 下载都会明确反馈结果，失败绝不假装成功。</div>
    </div>`;
}
async function saveDav(){
  davCfg.url=$('davUrl').value.trim();davCfg.user=$('davUser').value.trim();
  davCfg.enabled=$('davToggle').classList.contains('on');
  const pass=$('davPass').value.trim();
  try{
    await idbPut('sync','webdav',{url:davCfg.url,user:davCfg.user,enabled:davCfg.enabled});
    if(pass)await idbPut('secrets','webdav.password',await seal(pass));
    feedback('WebDAV 配置已保存到本机','ok');
  }catch(e){feedback('配置保存失败：'+e.message,'err');}
}
async function davSync(mode){
  const out=$('davOut');if(!out)return;
  if(!davCfg.enabled){out.textContent='未启用同步：请先在上方打开「启用同步」并保存配置。';return;}
  if(!davCfg.url){out.textContent='未配置 WebDAV 地址。';return;}
  try{
    const enc=await idbGet('secrets','webdav.password');
    const pass=enc?await unseal(enc):'';
    if(!pass){out.textContent='未填写 WebDAV 应用密码，已中止（不会伪造同步结果）。';return;}
    const auth='Basic '+btoa(davCfg.user+':'+pass);
    let res;
    if(mode==='upload'){
      const entities=buildEntities();
      const body=JSON.stringify({manifest:{schemaVersion:1,format:'studypack-open-v1',app:'studyagent',version:'2.0.0',exportedAt:new Date().toISOString(),checksum:checksum(entities),note:'Key 不在此包内'},entities:entities});
      res=await fetch(davCfg.url,{method:'PUT',headers:{'Authorization':auth,'Content-Type':'application/json'},body:body});
      out.textContent=res.ok?'上传成功（HTTP '+res.status+'）':'上传失败（HTTP '+res.status+'）';
    }else{
      res=await fetch(davCfg.url,{method:'GET',headers:{'Authorization':auth}});
      if(!res.ok){out.textContent='下载失败（HTTP '+res.status+'）';return;}
      const txt=await res.text();
      const d=JSON.parse(txt);
      if(!d.manifest||!d.entities){out.textContent='远端文件不是有效的 .studypack，未改动本机数据。';return;}
      const e=d.entities;
      if(e['exam_profile.json']&&e['exam_profile.json'][0])S.profile=e['exam_profile.json'][0];
      if(e['plans.json'])S.plans=e['plans.json'];
      if(e['slot_pool.json'])S.slots=e['slot_pool.json'];
      if(e['knowledge_base.json']&&e['knowledge_base.json'][0])S.knowledgeBase=e['knowledge_base.json'][0];
      if(e['tasks.json'])S.tasks=e['tasks.json'];
      if(e['weak_points.json'])S.weakPoints=e['weak_points.json'];
      save();renderPage();
      out.textContent='下载并恢复成功（HTTP '+res.status+'）';
    }
  }catch(e){out.textContent='同步失败：'+e.message+'（网络 / 跨域 / 凭据均可能导致，绝不假装成功）';}
}

function renderAll(){renderNav();renderPage();}
/* ===================== 启动 ===================== */
renderAll();   // 立即渲染，避免异步恢复期间白屏
(async function boot(){
  let saved=null;
  try{saved=await idbGet('state','main');}catch(e){_dbBroken=true;}
  const firstBoot=!(saved&&typeof saved==='object');
  if(!firstBoot)S=normalizeState(saved);
  _stateHash=stateHash();
  await loadSecrets();await loadDav();
  renderAll();
  if(firstBoot&&!S.onboarded)showOnboarding();  // P2-B：无本地数据 → 首启学情基线引导
})();
</script>
