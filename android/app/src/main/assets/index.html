<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>学习助手 · StudyAgent v2.0.0</title>
<style>
:root{
  --bg:#F4F6FB; --card:#FFFFFF; --ink:#1F2430; --ink-2:#5B6478; --ink-3:#9AA2B4;
  --line:#E6E9F0; --brand:#4F6EF7; --brand-2:#6D8BFF; --green:#2BB673; --green-soft:#E5F6EE;
  --blue:#3B82F6; --blue-soft:#E7F0FF; --gray:#C7CDDA; --gray-soft:#EEF1F6;
  --red:#E5484D; --amber:#F5A623; --purple:#8B5CF6; --pink:#EC4899; --orange:#F97316;
  --radius:16px; --radius-s:10px; --shadow:0 2px 10px rgba(31,36,48,.06);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px}
.hidden{display:none!important}

/* 设备外壳（预览用） */
#stage{display:flex;justify-content:center;padding:18px;gap:24px;flex-wrap:wrap}
.device{background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.device.phone{width:380px;height:760px}
.device.pad{width:860px;height:600px}
.viewport{flex:1;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);position:relative}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.brand{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-2))}
.devtoggle{display:flex;gap:6px}
.devtoggle button{border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:13px;color:var(--ink-2);background:var(--card)}
.devtoggle button.on{background:var(--brand);color:#fff;border-color:var(--brand)}

/* 导航 */
.nav-bottom{display:flex;border-top:1px solid var(--line);background:var(--card)}
.nav-bottom button{flex:1;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--ink-3)}
.nav-bottom button.on{color:var(--brand)}
.nav-bottom button .ic{font-size:20px;line-height:1}
.nav-top{display:none;gap:4px;background:var(--card);border-bottom:1px solid var(--line);padding:6px 10px;overflow-x:auto}
.nav-top button{padding:8px 16px;border-radius:20px;font-size:14px;color:var(--ink-2);white-space:nowrap}
.nav-top button.on{background:var(--blue-soft);color:var(--blue);font-weight:600}

/* 内容区 */
.page{flex:1;overflow-y:auto;padding:16px}
.page h2{font-size:18px;margin:2px 0 12px}
.page h3{font-size:15px;margin:14px 0 8px}
.muted{color:var(--ink-3);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--gray-soft);color:var(--ink-2)}
.tag.green{background:var(--green-soft);color:var(--green)}
.tag.blue{background:var(--blue-soft);color:var(--blue)}
.tag.amber{background:#FEF3E2;color:var(--amber)}
.btn{background:var(--brand);color:#fff;border-radius:var(--radius-s);padding:10px 14px;font-size:14px;font-weight:600}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.block{width:100%}
.btn:active{transform:translateY(1px)}
.fab{position:absolute;right:18px;bottom:18px;width:52px;height:52px;border-radius:50%;background:var(--brand);color:#fff;font-size:24px;box-shadow:0 6px 16px rgba(79,110,247,.4);display:flex;align-items:center;justify-content:center}
input.field,textarea.field,select.field{width:100%;border:1px solid var(--line);border-radius:var(--radius-s);padding:10px 12px;background:var(--card);color:var(--ink);margin-top:6px}
label.lbl{font-size:13px;color:var(--ink-2);display:block;margin-top:10px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv:last-child{border-bottom:none}
.empty{text-align:center;color:var(--ink-3);padding:30px 10px;font-size:14px}
.toggle{width:44px;height:26px;border-radius:20px;background:var(--gray);position:relative;transition:.2s;flex:none}
.toggle.on{background:var(--green)}
.toggle::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
.toggle.on::after{left:21px}

/* 规划卡片 */
.plan-card{border-left:4px solid var(--brand)}
.plan-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
/* 日历 */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-cell{border:1px solid var(--line);border-radius:10px;min-height:62px;padding:6px;font-size:12px;background:var(--card)}
.cal-cell.dim{background:var(--gray-soft);color:var(--ink-3)}
.cal-cell .d{font-weight:600}
.slot-pill{font-size:10px;padding:1px 5px;border-radius:6px;margin-top:3px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot-pill.free{background:var(--green-soft);color:var(--green)}
.slot-pill.plan{background:var(--blue-soft);color:var(--blue)}
.slot-pill.busy{background:var(--gray-soft);color:var(--ink-3)}
.legend{display:flex;gap:14px;margin:10px 0;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:middle}

/* 知识库 收纳 */
.kb-filter{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.kb-filter button{border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:13px;color:var(--ink-2);background:var(--card)}
.kb-filter button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.kb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.nb{height:120px;border-radius:14px;padding:12px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;position:relative;box-shadow:var(--shadow)}
.nb .nb-title{font-weight:700;font-size:15px}
.nb .nb-sub{font-size:11px;opacity:.85}
.nb .heart{position:absolute;top:10px;right:12px;font-size:16px;opacity:.9}
.nb .nb-count{font-size:11px;opacity:.9}
.kb-entry{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--card)}
.kb-entry .q{font-weight:600}
.kb-entry .meta{font-size:12px;color:var(--ink-3);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}

/* 速查卡 */
.quickcard{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.quickcard .for{font-size:12px;color:var(--ink-3)}
.quickcard .formula{font-weight:700;font-size:15px;margin:4px 0}
@media print{.no-print{display:none!important}.card,.quickcard{border:1px solid #999;box-shadow:none;break-inside:avoid}}

/* 反馈条 */
#feedback{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;background:rgba(31,36,48,.92);color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:88%;text-align:center}
#feedback.show{opacity:1}
#feedback.err{background:rgba(229,72,77,.95)}
#feedback.ok{background:rgba(43,182,115,.95)}

/* 弹层 */
.modal-mask{position:absolute;inset:0;background:rgba(15,18,28,.45);display:flex;align-items:flex-end;z-index:60}
.sheet{background:var(--card);width:100%;border-radius:20px 20px 0 0;padding:18px;max-height:86%;overflow-y:auto}
.sheet h3{margin-top:0}
.ai-out{background:var(--gray-soft);border-radius:10px;padding:10px;font-size:14px;white-space:pre-wrap;margin-top:10px;min-height:40px;color:var(--ink)}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.provider{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.provider.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--blue-soft)}
.provider .phead{display:flex;justify-content:space-between;align-items:center}
.bar{height:8px;border-radius:6px;background:var(--gray-soft);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--green)}
.printonly{display:none}
.preset-pick{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.preset-pick button{flex:1;min-width:120px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;background:var(--card);text-align:left}
.preset-pick button:hover{border-color:var(--brand)}
</style>
</head>
<body>
<div id="stage">
  <div class="device phone" id="device">
    <div class="viewport">
      <div class="topbar">
        <div class="brand"><span class="dot"></span>学习助手</div>
        <div class="devtoggle no-print">
          <button id="dev-phone" class="on" onclick="setDevice('phone')">📱手机</button>
          <button id="dev-pad" onclick="setDevice('pad')">📲平板</button>
        </div>
      </div>
      <div class="nav-top" id="navTop"></div>
      <div class="page" id="page"></div>
      <div id="feedback"></div>
      <div id="modalHost"></div>
      <div class="nav-bottom" id="navBottom"></div>
    </div>
  </div>
</div>

<script>
"use strict";
/* ===================== 状态 ===================== */
const KEY='studyagent.v2.state';
const KP='studyagent.v2.key.';            // 凭证按 provider 单独存，导出时剔除
const PROVIDER_PRESETS={
  deepseek:{label:'DeepSeek（推理/数学）',baseUrl:'https://api.deepseek.com/v1',model:'deepseek-chat',vision:true},
  openai:{label:'OpenAI · GPT（通用/写作）',baseUrl:'https://api.openai.com/v1',model:'gpt-4o',vision:true},
  claude:{label:'Claude（长文/讲解）',baseUrl:'https://api.anthropic.com/v1',model:'claude-3-5-sonnet',vision:true},
  qwen:{label:'通义千问 Qwen（中文）',baseUrl:'https://dashscope.aliyuncs.com/compatible-mode/v1',model:'qwen-max',vision:true},
  kimi:{label:'Kimi（长上下文/中文K12）',baseUrl:'https://api.moonshot.cn/v1',model:'moonshot-v1-32k',vision:false},
  doubao:{label:'豆包（中文/字节）',baseUrl:'https://ark.cn-beijing.volces.com/api/v3',model:'doubao-pro-32k',vision:false},
  glm:{label:'智谱 GLM（中文/学术）',baseUrl:'https://open.bigmodel.cn/api/paas/v4',model:'glm-4-plus',vision:false},
  gemini:{label:'Gemini（多模态/视觉）',baseUrl:'https://generativelanguage.googleapis.com/v1beta/openai',model:'gemini-1.5-pro',vision:true},
  ollama:{label:'Ollama（本地/离线隐私）',baseUrl:'http://localhost:11434/v1',model:'llama3',vision:false},
};
const SCHOOL_PRESETS={
  shenzhen:{region:'广东深圳',school:'深圳中学',paper:'新高考 I 卷（新课标 I 卷）',examMode:'3+1+2；数学不分文理',textbook:'人教 A 版（2019 新版）'},
  beijing:{region:'北京',school:'北京四中',paper:'北京卷',examMode:'自主命题',textbook:'人教 A 版（2019 新版）'},
  blank:{region:'',school:'',paper:'',examMode:'',textbook:''},
};
function fresh(){
  const providers={};
  for(const id in PROVIDER_PRESETS){const p=PROVIDER_PRESETS[id];providers[id]={baseUrl:p.baseUrl,model:p.model,label:p.label};}
  return {
    profile:{region:'',school:'',paper:'',examMode:'',textbook:'',knowledgeTree:[]},
    tasks:[],plans:[],slots:[],calendar:[],sessions:[],weakPoints:[],
    notes:{ai:[],mine:[]},resources:[],
    knowledgeBase:{notebooks:[],entries:[],onlineSupplement:false},
    providers,activeProvider:'deepseek',
    prefs:{reminderMode:'vibration',noteVisible:true,pretestVisible:true,onlineSupplement:false,dataOutbound:true},
    device:'phone',calMonth:null,
  };
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||fresh();}catch(e){S=fresh();}
if(!S.providers||!S.providers.deepseek){const f=fresh();S.providers=f.providers;S.activeProvider=S.activeProvider||'deepseek';}
if(!S.knowledgeBase)S.knowledgeBase={notebooks:[],entries:[],onlineSupplement:false};
function save(){localStorage.setItem(KEY,JSON.stringify(S));}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=p=>p+'-'+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
function feedback(msg,type){const f=$('feedback');f.textContent=msg;f.className=type||'';f.classList.add('show');clearTimeout(feedback._t);feedback._t=setTimeout(()=>f.classList.remove('show'),2600);}

/* ===================== AI 调用（契约与 v0.2.0 一致，支持多模型） ===================== */
function aiCfg(){const p=S.providers[S.activeProvider]||S.providers.deepseek;return {baseUrl:(p.baseUrl||'').trim(),model:(p.model||'').trim(),key:(localStorage.getItem(KP+S.activeProvider)||'').trim()};}
function hasKey(){return (localStorage.getItem(KP+S.activeProvider)||'').trim().length>0;}
// messages: OpenAI 格式数组。返回 Promise<content 文本>；失败 reject（绝不伪造回复）。
function aiRequest(messages){
  const cfg=aiCfg();
  return new Promise((resolve,reject)=>{
    if(!cfg.baseUrl)return reject(new Error('未配置 Base URL（我的→AI 设置）'));
    if(!cfg.key)return reject(new Error('未填写 API Key（我的→AI 设置）'));
    const payload={baseUrl:cfg.baseUrl,model:cfg.model,key:cfg.key,messages:messages};
    if(window.StudyAgentNative&&window.StudyAgentNative.callAi){
      const cb='c'+Math.random().toString(36).slice(2,9);
      window.__saAiResult=function(id,res){
        if(id!==cb)return;
        let r;try{r=JSON.parse(res);}catch(e){return reject(new Error('响应解析失败'));}
        if(r&&r.ok)resolve(r.content||'(空回复)');else reject(new Error((r&&r.error)||'AI 返回错误'));
      };
      try{window.StudyAgentNative.callAi(JSON.stringify(payload),cb);}
      catch(e){reject(new Error('原生桥接调用失败：'+e.message));}
    }else{
      fetch(cfg.baseUrl.replace(/\/+$/,'')+'/chat/completions',{
        method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
        body:JSON.stringify({model:cfg.model,messages:messages,stream:false})
      }).then(r=>r.json().then(j=>({r,j}))).then(({j})=>{
        if(j&&j.choices&&j.choices[0]&&j.choices[0].message)resolve(j.choices[0].message.content);
        else if(j&&j.error)reject(new Error(j.error.message||'AI 错误'));
        else reject(new Error('AI 返回结构异常'));
      }).catch(e=>reject(new Error('网络/请求失败：'+e.message)));
    }
  });
}
async function aiAsk(prompt,opts){
  opts=opts||{};
  const msgs=[{role:'system',content:opts.system||'你是严谨的学习助手，只依据用户提供的真实资料作答，不虚构题目与数据。'},
              {role:'user',content:prompt}];
  return aiRequest(msgs);
}

/* ===================== 知识库检索（供 AI 出题意图） ===================== */
function kbByPoint(kp){
  const k=(kp||'').trim().toLowerCase();if(!k)return [];
  return S.knowledgeBase.entries.filter(e=>(e.knowledgePoint||'').toLowerCase().includes(k)||(e.question||'').toLowerCase().includes(k));
}
function kbContext(kp,limit){
  return kbByPoint(kp).slice(0,limit||5).map(e=>({id:e.id,question:e.question,knowledgePoint:e.knowledgePoint,difficulty:e.difficulty,motherId:e.motherId}) );
}

/* ===================== 渲染骨架 ===================== */
const NAV=[{id:'today',ic:'🏠',t:'今日'},{id:'plan',ic:'🎯',t:'规划'},{id:'calendar',ic:'📅',t:'日历'},
           {id:'kb',ic:'📚',t:'知识库'},{id:'mine',ic:'⚙️',t:'我的'}];
function renderNav(){
  const bottom=$('navBottom'),top=$('navTop');
  bottom.innerHTML='';top.innerHTML='';
  NAV.forEach(n=>{
    const b=document.createElement('button');b.id='nav-'+n.id;b.innerHTML='<span class="ic">'+n.ic+'</span>'+n.t;
    if(currentPage===n.id)b.classList.add('on');
    b.onclick=()=>showPage(n.id);bottom.appendChild(b);
    const t=document.createElement('button');t.textContent=n.t;if(currentPage===n.id)t.classList.add('on');
    t.onclick=()=>showPage(n.id);top.appendChild(t);
  });
  document.getElementById('device').className='device '+(S.device==='pad'?'pad':'phone');
  document.querySelector('.nav-top').style.display=S.device==='pad'?'flex':'none';
  document.querySelector('.nav-bottom').style.display=S.device==='pad'?'none':'flex';
}
let currentPage='today';
function showPage(p){currentPage=p;renderNav();renderPage();if(S.device)save();}
function setDevice(d){S.device=d;renderNav();save();}

/* ===================== 各页面 ===================== */
function renderPage(){
  const pg=$('page');
  if(currentPage==='today')return renderToday(pg);
  if(currentPage==='plan')return renderPlan(pg);
  if(currentPage==='calendar')return renderCalendar(pg);
  if(currentPage==='kb')return renderKB(pg);
  if(currentPage==='mine')return renderMine(pg);
}
function renderToday(pg){
  const np=S.plans.filter(p=>p.status!=='achieved').length;
  const nt=S.tasks.length;
  pg.innerHTML=`<h2>今日</h2>
    <div class="card">
      <div class="row between"><b>待办概览</b><span class="tag blue">${np} 个进行中规划</span></div>
      <div class="kv"><span>日常任务</span><b>${nt}</b></div>
      <div class="kv"><span>知识库条目</span><b>${S.knowledgeBase.entries.length}</b></div>
      <div class="kv"><span>当前 AI</span><b>${esc((S.providers[S.activeProvider]||{}).label||S.activeProvider)}</b></div>
    </div>
    <div class="card">
      <h3>日常任务</h3>
      ${S.tasks.length?S.tasks.map(t=>`<div class="kv"><span>${esc(t.name)}</span><span class="muted">${esc(t.timeHm||'')}</span></div>`).join(''):'<div class="empty">还没有任务，去「规划」开始一个学习目标</div>'}
    </div>
    <div class="card">
      <h3>快速开始</h3>
      <button class="btn block" onclick="showPage('plan')">＋ 新建学习规划</button>
      <button class="btn ghost block" style="margin-top:8px" onclick="showPage('kb')">打开知识库</button>
    </div>`;
}
/* ---------- 规划 ---------- */
function renderPlan(pg){
  pg.innerHTML=`<h2>规划</h2>
    <div id="planList">
    ${S.plans.length?S.plans.map(cardPlan).join(''):'<div class="empty">还没有规划。<br>规划里可设定目标、时长、以及「会话配置 / 薄弱点 / 速查卡」。</div>'}
    </div>
    <button class="fab" id="btn-new-plan" onclick="openPlanEditor()" title="新建规划">＋</button>`;
}
function cardPlan(p){
  const wp=S.weakPoints.filter(w=>w.planId===p.id).length;
  return `<div class="card plan-card" id="plan-${p.id}" onclick="openPlanDetail('${p.id}')">
    <div class="row between"><b>${esc(p.goal)}</b><span class="tag ${p.status==='active'?'green':'amber'}">${p.status==='active'?'进行中':'已结束'}</span></div>
    <div class="plan-meta">
      <span class="tag">目标达成 ${Math.round((p.quantTarget||0.75)*100)}%</span>
      <span class="tag blue">${p.deadlineDays||15} 天</span>
      <span class="tag">薄弱点 ${wp}</span>
    </div></div>`;
}
function openPlanDetail(id){
  const p=S.plans.find(x=>x.id===id);if(!p)return;
  const wps=S.weakPoints.filter(w=>w.planId===id);
  openSheet(`<h3>${esc(p.goal)} · 规划详情</h3>
    <div class="kv"><span>目标达成线</span><b>${Math.round((p.quantTarget||0.75)*100)}%</b></div>
    <div class="kv"><span>时限</span><b>${p.deadlineDays||15} 天</b></div>
    <div class="kv"><span>开始方式</span><b>${p.startMode==='immediate'?'立即':'定时'}</b></div>
    <h3>会话配置（仅本规划生效）</h3>
    <div class="kv"><span>摸底测试</span><b>${p.pretestSkipped?'可跳过':'必做'}</b></div>
    <div class="kv"><span>难度档位</span><b>${({basic:'基础',medium:'中档',hard:'压轴'})[p.difficulty||'medium']}</b></div>
    <div class="kv"><span>挑战自信模式</span><b>${p.challenge?'开':'关'}</b></div>
    <h3>薄弱点（${wps.length}）</h3>
    <div id="wpList">${wps.length?wps.map(wpItem).join(''):'<div class="muted">暂无，学完测验后自动归集</div>'}</div>
    <button class="btn sm ghost" onclick="addWeakPoint('${id}')" id="btn-add-weakpoint">＋ 记录薄弱点</button>

/* ---------- 日历 ---------- */
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function monthMatrix(y,m){
  const first=new Date(y,m,1);const start=(first.getDay()+6)%7;const days=new Date(y,m+1,0).getDate();
  const arr=[];for(let i=0;i<start;i++)arr.push(null);for(let d=1;d<=days;d++)arr.push(d);return {arr,days};
}
function renderCalendar(pg){
  const now=new Date();const ym=S.calMonth?S.calMonth:{y:now.getFullYear(),m:now.getMonth()};
  if(!S.calMonth)S.calMonth=ym;
  const {arr}=monthMatrix(ym.y,ym.m);
  const dateStr=d=>`${ym.y}-${String(ym.m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  let cells='';
  arr.forEach(d=>{
    if(d===null){cells+='<div class="cal-cell dim"></div>';return;}
    const ds=dateStr(d);
    const frees=S.slots.filter(s=>s.date===ds);
    const sess=S.sessions.filter(s=>s.date===ds);
    let pills='';
    frees.forEach(s=>pills+=`<span class="slot-pill free">${minToHm(s.startMin)}–${minToHm(s.endMin)} 空闲</span>`);
    sess.forEach(s=>pills+=`<span class="slot-pill plan">规划时段</span>`);
    if(!frees.length&&!sess.length)pills='<span class="slot-pill busy">—</span>';
    cells+=`<div class="cal-cell" id="cell-${ds}"><div class="d">${d}</div>${pills}</div>`;
  });
  pg.innerHTML=`<h2>日历</h2>
    <div class="cal-head">
      <button class="btn ghost sm" id="cal-prev" onclick="calMove(-1)">‹</button>
      <b>${ym.y} 年 ${ym.m+1} 月</b>
      <button class="btn ghost sm" id="cal-next" onclick="calMove(1)">›</button>
    </div>
    <div class="cal-grid"><div class="cal-cell dim" style="min-height:auto;text-align:center">一</div><div class="cal-cell dim" style="min-height:auto;text-align:center">二</div><div class="cal-cell dim" style="min-height:auto;text-align:center">三</div><div class="cal-cell dim" style="min-height:auto;text-align:center">四</div><div class="cal-cell dim" style="min-height:auto;text-align:center">五</div><div class="cal-cell dim" style="min-height:auto;text-align:center">六</div><div class="cal-cell dim" style="min-height:auto;text-align:center">日</div>${cells}</div>
    <div class="legend"><span><i style="background:var(--green)"></i>空闲可学</span><span><i style="background:var(--blue)"></i>已排规划</span><span><i style="background:var(--gray)"></i>无安排</span></div>
    <button class="btn block" id="btn-add-slot" onclick="openAddSlot()">＋ 自定义添加空闲时段</button>`;
}
function minToHm(m){const h=Math.floor(m/60),mm=m%60;return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0');}
function calMove(d){const ym=S.calMonth;let m=ym.m+d,y=ym.y;if(m<0){m=11;y--;}if(m>11){m=0;y++;}S.calMonth={y,m};save();renderCalendar($('page'));}

  const preset=PROVIDER_PRESETS[S.activeProvider];

  try{
    const dataUrl=await fileToDataUrl(file);
    const content=[{type:'text',text:'请识别这张学习资料/题目截图，提取题干与关键知识点，用中文简洁列出。'},{type:'image_url',image_url:{url:dataUrl}}];

  }catch(e){ent.answer='（分析失败：'+e.message+'）';save();if(kbView)renderKbBody($('kbBody'));}
}

    <div class="card">
      <div class="kv"><span>联网补充（学科网等，可选）</span><span class="toggle ${S.prefs.onlineSupplement?'on':''}" id="onlineToggle" onclick="toggleOnline(this)"></span></div>
      <div class="muted">默认只对你的自有资料做匹配；开启后可将已配置的在线权威源作为补充检索。</div>
    </div>
    <div class="card">
      <h3 style="margin-top:0">数据</h3>
      <button class="btn ghost block" id="btn-export" onclick="exportPack()">导出 .studypack（不含 Key）</button>
      <button class="btn ghost block" style="margin-top:8px" id="btn-import" onclick="document.getElementById('impIn').click()">导入 .studypack</button>
      <input id="impIn" type="file" accept=".json,application/json" style="display:none" onchange="importPack(this)">
      <button class="btn ghost block" style="margin-top:8px" onclick="printQuickCards()">打印速查卡（屏幕/黑白双态）</button>
    </div>
    <div class="card">
      <h3 style="margin-top:0">关于</h3>
      <div class="muted">学习助手 StudyAgent · v2.0.0 · 数据本地存储、可全量导出；AI 经可插拔 Provider，Key 仅存本机。</div>
    </div>`;
}
function provRow(id){
  const p=S.providers[id];const on=id===S.activeProvider;
  return `<div class="provider ${on?'on':''}" id="prov-${id}"><div class="phead"><b>${esc(p.label||id)}</b>
    <button class="btn sm ${on?'':'ghost'}" onclick="selectProvider('${id}')">${on?'使用中':'使用'}</button></div>
    <div class="muted" style="font-size:12px">${esc(p.baseUrl)} · ${esc(p.model)}</div>
    <button class="btn sm ghost" style="margin-top:6px" onclick="editProvider('${id}')">配置 / 填 Key</button></div>`;
}
function selectProvider(id){S.activeProvider=id;save();renderMine($('page'));feedback('已切换到 '+id,'ok');}
function editProvider(id){
  const p=S.providers[id];const key=localStorage.getItem(KP+id)||'';
  $('provEditor').innerHTML=`<div class="card" style="margin-top:10px">
    <h3 style="margin-top:0">${esc(p.label||id)} 配置</h3>
    <label class="lbl">Base URL</label><input class="field" id="pvUrl" value="${esc(p.baseUrl)}">
    <label class="lbl">Model ID</label><input class="field" id="pvModel" value="${esc(p.model)}">
    <label class="lbl">API Key（仅存本机，不进导出包）</label><input class="field" id="pvKey" type="password" value="${esc(key)}" placeholder="sk-...">
    <div class="row" style="gap:8px;margin-top:10px">
      <button class="btn sm" id="btn-save-provider" onclick="saveProvider('${id}')">保存</button>
      <button class="btn sm ghost" id="btn-test-ai" onclick="testProvider('${id}')">测试连接</button>
    </div><div class="ai-out" id="pvOut"></div></div>`;
}
function saveProvider(id){
  const p=S.providers[id];p.baseUrl=$('pvUrl').value.trim();p.model=$('pvModel').value.trim();
  const k=$('pvKey').value.trim();if(k)localStorage.setItem(KP+id,k);else localStorage.removeItem(KP+id);
  save();renderMine($('page'));feedback('已保存','ok');
}
async function testProvider(id){
  const out=$('pvOut');out.textContent='连接测试中…';
  try{const r=await aiAsk('回复“连通正常”两个字即可');out.textContent='✓ '+r;}
  catch(e){out.textContent='✗ '+e.message;}
}
function toggleOnline(el){el.classList.toggle('on');S.prefs.onlineSupplement=el.classList.contains('on');S.knowledgeBase.onlineSupplement=S.prefs.onlineSupplement;save();feedback('联网补充 '+(S.prefs.onlineSupplement?'开':'关'),'ok');}
function applySchool(k){S.profile=Object.assign({},S.profile,SCHOOL_PRESETS[k]);if(k==='blank')S.profile={region:'',school:'',paper:'',examMode:'',textbook:'',knowledgeTree:[]};save();renderMine($('page'));feedback('已套用预设（可继续手动改）','ok');}
function openProfile(){
  openSheet(`<h3>学情基线</h3>
    <label class="lbl">地区</label><input class="field" id="prRegion" value="${esc(S.profile.region)}">
    <label class="lbl">学校</label><input class="field" id="prSchool" value="${esc(S.profile.school)}">
    <label class="lbl">考卷</label><input class="field" id="prPaper" value="${esc(S.profile.paper)}">
    <label class="lbl">教材版本</label><input class="field" id="prBook" value="${esc(S.profile.textbook)}">
    <label class="lbl">考试模式</label><input class="field" id="prMode" value="${esc(S.profile.examMode)}">
    <button class="btn block" style="margin-top:12px" onclick="saveProfile()">保存</button>`);
}
function saveProfile(){S.profile={region:$('prRegion').value,paper:$('prPaper').value,school:$('prSchool').value,examMode:$('prMode').value,textbook:$('prBook').value,knowledgeTree:S.profile.knowledgeTree||[]};save();closeSheet();renderMine($('page'));feedback('已保存','ok');}
/* ---------- 导入导出 ---------- */
function buildEntities(){
  return {
    'preferences.json':[S.prefs],
    'exam_profile.json':[S.profile],
    'school_calendar.json':S.calendar,
    'slot_pool.json':S.slots,
    'tasks.json':S.tasks,
    'plans.json':S.plans,
    'sessions.json':S.sessions,
    'weak_points.json':S.weakPoints,
    'review.json':[],
    'ai_notes.json':S.notes.ai,
    'my_notes.json':S.notes.mine,
    'anchor_links.json':[],
    'resources.json':S.resources,
    'knowledge_base.json':[S.knowledgeBase],
  };
}
function exportPack(){
  const data={manifest:{schemaVersion:1,format:'studypack-open-v1',app:'studyagent',version:'2.0.0',exportedAt:new Date().toISOString(),note:'Key 不在此包内'},entities:buildEntities()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='studyagent-'+todayStr()+'.studypack.json';a.click();
  feedback('已导出（已剔除 API Key）','ok');
}
function importPack(input){
  const f=input.files&&input.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{try{
    const d=JSON.parse(r.result);const e=d.entities||{};
    for(const k in e){if(k==='exam_profile.json'&&e[k][0])S.profile=e[k][0];
      else if(k==='plans.json')S.plans=e[k];else if(k==='slots.json')S.slots=e[k];
      else if(k==='tasks.json')S.tasks=e[k];else if(k==='weak_points.json')S.weakPoints=e[k];
      else if(k==='knowledge_base.json'&&e[k][0])S.knowledgeBase=e[k][0];
      else if(k==='preferences.json'&&e[k][0])S.prefs=Object.assign(S.prefs,e[k][0]);
      else if(k==='sessions.json')S.sessions=e[k];
      else if(k==='my_notes.json')S.notes.mine=e[k];else if(k==='ai_notes.json')S.notes.ai=e[k];
      else if(k==='resources.json')S.resources=e[k];else if(k==='school_calendar.json')S.calendar=e[k];}
    save();renderAll();feedback('导入成功','ok');
  }catch(err){feedback('导入失败：'+err.message,'err');}};r.readAsText(f);
}
/* ---------- 打印速查卡 ---------- */
function printQuickCards(){
  const items=S.knowledgeBase.entries.filter(e=>e.question);
  const w=window.open('','_blank');if(!w){feedback('请允许弹窗以打印','err');return;}
  w.document.write('<h2>速查卡（黑白可打印态）</h2>'+ (items.length?items.map(e=>`<div style="border:1px solid #999;padding:8px;margin:6px 0"><b>${esc(e.knowledgePoint||'')}</b><br>${esc(e.question)}<br><span style="font-size:12px">[${esc(e.difficulty)}]</span></div>`).join(''):'<p>无速查卡</p>')+'<script>window.onload=function(){window.print();}<'+'/script>');
  w.document.close();
}
/* ===================== 弹层 ===================== */
function openSheet(html){$('modalHost').innerHTML=`<div class="modal-mask" onclick="if(event.target===this)closeSheet()"><div class="sheet">${html}</div></div>`;}
function closeSheet(){$('modalHost').innerHTML='';}
function renderAll(){renderNav();renderPage();}
/* ===================== 启动 ===================== */
renderAll();
</script>
</body>
</html>
